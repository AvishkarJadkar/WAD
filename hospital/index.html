<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare | Patient Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">MediCare HMS</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Left Side: Registration Form -->
            <div class="col-lg-5 mb-4">
                <div class="counter-card p-3 shadow-sm bg-white rounded-3 mb-3 text-center">
                    <h5 class="text-secondary mb-0">Total Registered</h5>
                    <div id="patientCount" class="display-5 fw-bold text-primary">0</div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h4 class="mb-4 text-primary">New Registration</h4>
                        <form id="registrationForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="patientName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" id="patientPhone" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Department</label>
                                <select id="department" class="form-select" required>
                                    <option value="">Select...</option>
                                    <option>Cardiology</option>
                                    <option>Neurology</option>
                                    <option>Pediatrics</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add Patient</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Side: Data Display Table -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Patient Directory</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Phone</th>
                                    <th>Dept</th>
                                </tr>
                            </thead>
                            <tbody id="patientTableBody">
                                <!-- Data will appear here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
