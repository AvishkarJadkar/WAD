<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Estates | Premier Property Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">ELITE<span>ESTATES</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Listings</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-outline-dark ms-lg-3" href="#contact">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-center text-white d-flex align-items-center">
        <div class="container">
            <h1 class="display-3 fw-bold">Find Your Dream Home</h1>
            <p class="lead">Discover the most exclusive properties in the city's prime locations.</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="row mb-4">
            <div class="col">
                <h2 class="section-title">Featured Properties</h2>
            </div>
        </div>

        <div class="row g-4" id="property-container">
        </div>
    </main>

    <footer id="contact" class="bg-dark text-white py-5 mt-5">
        <div class="container text-center">
            <h3>Ready to find your new home?</h3>
            <p>Our agents are available 24/7 for consultations.</p>
            <button class="btn btn-primary btn-lg mt-3"
                onclick="alert('Thank you for reaching out! We will call you shortly.')">Contact Our Agency</button>
            <div class="mt-4 opacity-50">
                <p>&copy; 2023 Elite Estates Portal. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
