<div class="auth-wrapper">
  <div class="auth-card glass-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join our community today</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" placeholder="Enter username">
        <div *ngIf="f['username'].touched && f['username'].errors" class="error-message">
          <span *ngIf="f['username'].errors['required']">Username is required</span>
          <span *ngIf="f['username'].errors['minlength']">Username must be at least 3 characters</span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter email">
        <div *ngIf="f['email'].touched && f['email'].errors" class="error-message">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Invalid email address</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••">
        <div *ngIf="f['password'].touched && f['password'].errors" class="error-message">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Creating Account...' : 'Sign Up' }}
      </button>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Login</a>
      </div>

      <div *ngIf="error" class="error-message main-error">
        {{ error }}
      </div>
    </form>
  </div>
</div>
