<div class="auth-wrapper">
  <div class="auth-card glass-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Enter your credentials to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter email">
        <div *ngIf="f['email'].touched && f['email'].errors" class="error-message">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Invalid email address</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••">
        <div *ngIf="f['password'].touched && f['password'].errors" class="error-message">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Signing In...' : 'Login' }}
      </button>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/register">Sign Up</a>
      </div>

      <div *ngIf="error" class="error-message main-error">
        {{ error }}
      </div>
    </form>
  </div>
</div>
