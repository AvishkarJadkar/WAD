<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHigh | Flight Management Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold px-3" href="#">
                <i class="bi bi-airplane-engines-fill me-2"></i>SKYHIGH AIRLINES
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Flight Schedules</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Passenger List</a></li>
                </ul>

                <!-- Search Box -->
                <form class="d-flex mx-auto col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="bi bi-search text-muted"></i></span>
                        <input class="form-control border-start-0 shadow-none" type="search"
                            placeholder="Search PNR or Flight No..." aria-label="Search">
                    </div>
                </form>

                <div class="d-flex align-items-center ms-3">
                    <div class="text-white me-3 text-end d-none d-lg-block">
                        <small class="d-block opacity-75">Terminal Admin</small>
                        <span class="fw-bold">Capt. James Wilson</span>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=James+Wilson&background=fff&color=0d6efd" width="40"
                        height="40" class="rounded-circle shadow-sm border border-2 border-white">
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4">
        <!-- Quick Stats -->
        <div class="row g-3 mb-4" id="stat-cards">
            <!-- Dynamic stats from JS -->
        </div>

        <div class="row g-4">
            <!-- Booking Form / Filters -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Quick Book / Filter</h5>
                        <form id="bookingFilter">
                            <div class="mb-3">
                                <label class="form-label small text-uppercase fw-bold text-muted">From</label>
                                <input type="text" class="form-control" placeholder="City or Airport">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-uppercase fw-bold text-muted">To</label>
                                <input type="text" class="form-control" placeholder="City or Airport">
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label small text-uppercase fw-bold text-muted">Departure</label>
                                    <input type="date" class="form-control">
                                </div>
                                <div class="col">
                                    <label class="form-label small text-uppercase fw-bold text-muted">Class</label>
                                    <select class="form-select">
                                        <option>Economy</option>
                                        <option>Business</option>
                                        <option>First Class</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">SEARCH
                                FLIGHTS</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Flight Status Table -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-header bg-white py-3 border-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold">Live Booking Status</h5>
                            <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()"><i
                                    class="bi bi-arrow-clockwise"></i> Refresh</button>
                        </div>
                    </div>
                    <div class="table-responsive p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th>Flight</th>
                                    <th>Passenger</th>
                                    <th>PNR</th>
                                    <th>Status</th>
                                    <th>Seat</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="flight-table">
                                <!-- Data from JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
