<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHigh | Flight Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        
        /* Navbar & Search */
        .navbar { background: #1a237e; }
        .search-container { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-control-lg { border-radius: 10px; font-size: 1rem; border: 1px solid #dee2e6; }

        /* Flight Cards */
        .flight-card { border: none; border-radius: 12px; transition: 0.3s; margin-bottom: 15px; }
        .flight-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.1) !important; transform: scale(1.01); }
        .airline-logo { width: 50px; height: 50px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        
        .dot-line { border-top: 2px dashed #cbd5e0; flex-grow: 1; margin: 0 15px; position: relative; top: 12px; }
        .price-tag { color: #1a237e; font-weight: 700; font-size: 1.4rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-airplane-engines me-2"></i>SkyHigh</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Flights</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person-circle"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="search-container mb-5">
            <h5 class="fw-bold mb-3">Where are you flying?</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="small text-muted">From</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" class="form-control form-control-lg bg-light border-0" placeholder="Pune (PNQ)">
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="small text-muted">To</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-geo-fill"></i></span>
                        <input type="text" class="form-control form-control-lg bg-light border-0" placeholder="Dubai (DXB)">
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="small text-muted">Date</label>
                    <input type="date" class="form-control form-control-lg bg-light border-0">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-primary btn-lg w-100 shadow-sm"><i class="bi bi-search"></i></button>
                </div>
            </div>
        </div>

        <h5 class="mb-4">Available Flights</h5>
        
        <div class="card flight-card shadow-sm">
            <div class="card-body p-4">
                <div class="row align-items-center text-center text-md-start">
                    <div class="col-md-2 d-flex align-items-center">
                        <div class="airline-logo me-3"><i class="bi bi-lightning-fill text-warning"></i></div>
                        <div><h6 class="mb-0">Indigo</h6><small class="text-muted">6E-204</small></div>
                    </div>
                    <div class="col-md-2">
                        <h5 class="mb-0">06:00</h5>
                        <small class="text-muted">PNQ</small>
                    </div>
                    <div class="col-md-3 d-none d-md-flex align-items-center text-center">
                        <div class="dot-line"></div>
                        <small class="text-muted">3h 20m</small>
                        <div class="dot-line"></div>
                    </div>
                    <div class="col-md-2">
                        <h5 class="mb-0">09:20</h5>
                        <small class="text-muted">DXB</small>
                    </div>
                    <div class="col-md-3 text-md-end mt-3 mt-md-0">
                        <div class="price-tag mb-2">₹12,499</div>
                        <button class="btn btn-dark px-4">Book Now</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card flight-card shadow-sm">
            <div class="card-body p-4">
                <div class="row align-items-center text-center text-md-start">
                    <div class="col-md-2 d-flex align-items-center">
                        <div class="airline-logo me-3"><i class="bi bi-star-fill text-primary"></i></div>
                        <div><h6 class="mb-0">Air India</h6><small class="text-muted">AI-502</small></div>
                    </div>
                    <div class="col-md-2">
                        <h5 class="mb-0">14:15</h5>
                        <small class="text-muted">PNQ</small>
                    </div>
                    <div class="col-md-3 d-none d-md-flex align-items-center text-center">
                        <div class="dot-line"></div>
                        <small class="text-muted">3h 45m</small>
                        <div class="dot-line"></div>
                    </div>
                    <div class="col-md-2">
                        <h5 class="mb-0">18:00</h5>
                        <small class="text-muted">DXB</small>
                    </div>
                    <div class="col-md-3 text-md-end mt-3 mt-md-0">
                        <div class="price-tag mb-2">₹14,200</div>
                        <button class="btn btn-dark px-4">Book Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
