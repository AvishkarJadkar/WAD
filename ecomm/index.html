<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCentral Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        
        /* Navbar Styling */
        .navbar { background: #ffffff; border-bottom: 1px solid #e0e0e0; }
        .search-box { border-radius: 20px; background: #f1f3f5; border: none; padding-left: 40px; }
        .search-icon { position: absolute; left: 15px; top: 10px; color: #adb5bd; }

        /* Sidebar Styling */
        .sidebar { min-height: calc(100vh - 56px); background: white; border-right: 1px solid #e0e0e0; padding-top: 20px; }
        .nav-link { color: #495057; font-weight: 500; padding: 12px 20px; border-radius: 0 25px 25px 0; margin-right: 10px; }
        .nav-link:hover, .nav-link.active { background: #e7f1ff; color: #0d6efd; }

        /* Product Cards */
        .product-card { border: none; border-radius: 12px; transition: 0.3s; overflow: hidden; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .badge-sale { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="#">ShopCentral</a>
            
            <div class="d-flex flex-grow-1 mx-lg-5 position-relative">
                <i class="bi bi-search search-icon"></i>
                <input class="form-control search-box w-100" type="search" placeholder="Search products, brands, and more...">
            </div>

            <div class="d-flex align-items-center">
                <a href="#" class="text-dark me-4 position-relative">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
                </a>
                <img src="https://ui-avatars.com/api/?name=User&background=0d6efd&color=fff" class="rounded-circle" width="35" alt="Profile">
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-none d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-grid me-2"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-tag me-2"></i> Categories</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-heart me-2"></i> Wishlist</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-box-seam me-2"></i> My Orders</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-wallet2 me-2"></i> Payments</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h4">Summer Collection 2026</h2>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary btn-sm">Sort By</button>
                        <button class="btn btn-outline-secondary btn-sm">Filter</button>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="card product-card shadow-sm h-100">
                            <span class="badge bg-danger badge-sale">Sale</span>
                            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=60" class="card-img-top" alt="Product">
                            <div class="card-body">
                                <h6 class="card-title mb-1">Smart Watch Series 7</h6>
                                <p class="text-muted small mb-2">Electronics</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-primary">$299.00</span>
                                    <button class="btn btn-sm btn-primary"><i class="bi bi-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="card product-card shadow-sm h-100">
                            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=60" class="card-img-top" alt="Product">
                            <div class="card-body">
                                <h6 class="card-title mb-1">Running Sneakers</h6>
                                <p class="text-muted small mb-2">Footwear</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-primary">$120.00</span>
                                    <button class="btn btn-sm btn-primary"><i class="bi bi-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="card product-card shadow-sm h-100">
                            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=60" class="card-img-top" alt="Product">
                            <div class="card-body">
                                <h6 class="card-title mb-1">Wireless Headphones</h6>
                                <p class="text-muted small mb-2">Audio</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-primary">$199.00</span>
                                    <button class="btn btn-sm btn-primary"><i class="bi bi-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="card product-card shadow-sm h-100">
                            <img src="https://images.unsplash.com/photo-1585333127302-c2c98189b39a?auto=format&fit=crop&w=500&q=60" class="card-img-top" alt="Product">
                            <div class="card-body">
                                <h6 class="card-title mb-1">Classic Camera</h6>
                                <p class="text-muted small mb-2">Photography</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-primary">$450.00</span>
                                    <button class="btn btn-sm btn-primary"><i class="bi bi-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
