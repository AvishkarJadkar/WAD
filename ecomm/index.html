<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAdmin | Interactive E-Commerce Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar d-none d-lg-block shadow-sm">
        <div class="p-4">
            <h4 class="fw-bold text-primary mb-4"><i class="bi bi-cart4 me-2"></i>ShopAdmin</h4>
            <nav class="nav flex-column">
                <a class="nav-link active" href="#"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a class="nav-link" href="#"><i class="bi bi-bag-check me-2"></i> Orders</a>
                <a class="nav-link" href="#"><i class="bi bi-box-seam me-2"></i> Products</a>
                <a class="nav-link" href="#"><i class="bi bi-people me-2"></i> Customers</a>
                <hr>
                <a class="nav-link text-muted" href="#"><i class="bi bi-gear me-2"></i> Settings</a>
            </nav>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top px-4 shadow-sm">
            <div class="container-fluid">
                <form class="d-flex col-12 col-lg-6 mb-2 mb-lg-0 me-lg-auto">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
                        <input class="form-control bg-light border-0 shadow-none" type="search"
                            placeholder="Search orders, products...">
                    </div>
                </form>
                <div class="d-flex align-items-center ms-lg-3">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D6EFD&color=fff" width="32"
                        height="32" class="rounded-circle me-2">
                    <span class="fw-bold d-none d-md-inline">Alex Admin</span>
                </div>
            </div>
        </nav>

        <!-- Dashboard Content -->
        <div class="p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0">Store Overview</h2>
                <button class="btn btn-primary px-4 py-2 fw-bold" data-bs-toggle="modal"
                    data-bs-target="#addProductModal">
                    <i class="bi bi-plus-lg me-2"></i>Add Product
                </button>
            </div>

            <!-- KPI Cards -->
            <div class="row g-4 mb-4" id="kpi-grid"></div>

            <!-- Product Table -->
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white py-3 border-0">
                    <h5 class="mb-0 fw-bold">Inventory Management</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body">
                            <!-- Injected by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Adding Products -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="productForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Product Name</label>
                            <input type="text" id="pName" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Category</label>
                                <select id="pCat" class="form-select">
                                    <option>Electronics</option>
                                    <option>Fashion</option>
                                    <option>Furniture</option>
                                    <option>Home Decor</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Price ($)</label>
                                <input type="number" id="pPrice" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Stock Quantity</label>
                            <input type="number" id="pStock" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Confirm & Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
