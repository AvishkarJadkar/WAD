<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Academic Dashboard</h1>

    <div class="table-container">
        <!-- Table 1: Results -->
        <div class="table-box">
            <h3>Examination Results</h3>
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Alice Johnson</td>
                        <td class="pass">Pass</td>
                    </tr>
                    <tr>
                        <td>Mark Smith</td>
                        <td class="fail">Fail</td>
                    </tr>
                    <tr>
                        <td>Sara Lee</td>
                        <td class="pass">Pass</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Table 2: CGPA -->
        <div class="table-box">
            <h3>Student Performance</h3>
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>CGPA</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Alice Johnson</td>
                        <td>3.85</td>
                    </tr>
                    <tr>
                        <td>Mark Smith</td>
                        <td>1.90</td>
                    </tr>
                    <tr>
                        <td>Sara Lee</td>
                        <td>3.60</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
