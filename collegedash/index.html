<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse | College Management Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar d-none d-lg-block shadow">
        <div class="p-4">
            <h4 class="fw-bold text-white mb-4"><i class="bi bi-mortarboard-fill me-2"></i>EduPulse</h4>
            <nav class="nav flex-column">
                <a class="nav-link active" href="#"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a class="nav-link" href="#"><i class="bi bi-book me-2"></i> Academics</a>
                <a class="nav-link" href="#"><i class="bi bi-calendar-event me-2"></i> Events</a>
                <a class="nav-link" href="#"><i class="bi bi-wallet2 me-2"></i> Fee Payment</a>
                <a class="nav-link" href="#"><i class="bi bi-file-earmark-text me-2"></i> Exams & Results</a>
                <hr class="text-white opacity-25">
                <a class="nav-link" href="#"><i class="bi bi-person-circle me-2"></i> My Profile</a>
            </nav>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top px-4 shadow-sm">
            <div class="container-fluid">
                <!-- Search Box -->
                <form class="d-flex col-12 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
                        <input class="form-control bg-light border-0 shadow-none" type="search"
                            placeholder="Search courses, faculty, or IDs..." aria-label="Search">
                    </div>
                </form>

                <div class="ms-auto d-flex align-items-center">
                    <div class="dropdown me-3">
                        <button class="btn btn-light position-relative rounded-circle" type="button">
                            <i class="bi bi-bell fs-5"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">5</span>
                        </button>
                    </div>
                    <div class="text-end d-none d-md-block me-2">
                        <span class="d-block fw-bold small">Dr. Vikram Sharma</span>
                        <small class="text-muted">HOD - IT Dept</small>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=Vikram+Sharma&background=0D6EFD&color=fff" width="40"
                        height="40" class="rounded-circle shadow-sm">
                </div>
            </div>
        </nav>

        <!-- Dashboard Content -->
        <div class="p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0">Campus Overview</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addNoticeModal">
                    <i class="bi bi-plus-circle me-2"></i>Post Notice
                </button>
            </div>

            <!-- Analytics Cards -->
            <div class="row g-4 mb-4" id="stat-grid"></div>

            <!-- Notices & Announcements Table -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 border-0">
                    <h5 class="mb-0 fw-bold text-primary">Active Notices & Circulars</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Ref ID</th>
                                <th>Announcement Subject</th>
                                <th>Category</th>
                                <th>Post Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="notice-table-body">
                            <!-- Injected by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Adding New Notice -->
    <div class="modal fade" id="addNoticeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog border-0">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Create New Announcement</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="noticeForm">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Subject / Title</label>
                            <input type="text" id="nSubject" class="form-control"
                                placeholder="e.g. Mid-term Exam Schedule" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Category</label>
                            <select id="nCategory" class="form-select">
                                <option>Academic</option>
                                <option>Examination</option>
                                <option>Sports/Cultural</option>
                                <option>Administrative</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-4 pt-0">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Publish Notice</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
